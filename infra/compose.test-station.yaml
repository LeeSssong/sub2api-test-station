name: sub2api-test-station
services:
  test-station-api:
    image: ${TEST_STATION_IMAGE:?TEST_STATION_IMAGE is required}
    environment:
      LAB_ONLY: "1"
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_PROCESS_ROLE: api
      DATABASE_HOST: test-station-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${TEST_STATION_DB_USER:?}
      DATABASE_PASSWORD: ${TEST_STATION_DB_PASSWORD:?}
      DATABASE_DBNAME: ${TEST_STATION_DB_NAME:?}
      REDIS_HOST: test-station-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${TEST_STATION_REDIS_PASSWORD:?}
      ADMIN_EMAIL: ${TEST_STATION_ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${TEST_STATION_ADMIN_PASSWORD:?}
      JWT_SECRET: ${TEST_STATION_JWT_SECRET:?}
      CSRF_SECRET: ${TEST_STATION_CSRF_SECRET:?}
      AUTH_COOKIE_NAME: test_station_session
      FRONTEND_BASE_PATH: /
      PAYMENT_PROVIDER: ${TEST_STATION_PAYMENT_PROVIDER:?}
      UPSTREAM_PROVIDER: ${TEST_STATION_UPSTREAM_PROVIDER:?}
      NOTIFICATION_TRANSPORT: ${TEST_STATION_NOTIFICATION_TRANSPORT:?}
    depends_on: {test-station-postgres: {condition: service_healthy}, test-station-redis: {condition: service_healthy}}
    volumes: [test-station-data:/app/data]
    networks: [test-station]
    healthcheck: {test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"], interval: 10s, timeout: 5s, retries: 10}
  test-station-worker:
    image: ${TEST_STATION_IMAGE:?TEST_STATION_IMAGE is required}
    environment:
      LAB_ONLY: "1"
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_PROCESS_ROLE: worker
      DATABASE_HOST: test-station-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${TEST_STATION_DB_USER:?}
      DATABASE_PASSWORD: ${TEST_STATION_DB_PASSWORD:?}
      DATABASE_DBNAME: ${TEST_STATION_DB_NAME:?}
      REDIS_HOST: test-station-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${TEST_STATION_REDIS_PASSWORD:?}
    command: [/bin/sh, -ec, 'exec /app/sub2api']
  test-station-postgres:
    image: postgres:18-alpine
    environment: {POSTGRES_DB: ${TEST_STATION_DB_NAME:?}, POSTGRES_USER: ${TEST_STATION_DB_USER:?}, POSTGRES_PASSWORD: ${TEST_STATION_DB_PASSWORD:?}}
    volumes: [test-station-postgres:/var/lib/postgresql]
    networks: [test-station]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 20}
  test-station-redis:
    image: redis:8-alpine
    command: [redis-server, --requirepass, ${TEST_STATION_REDIS_PASSWORD:?}]
    volumes: [test-station-redis:/data]
    networks: [test-station]
    healthcheck: {test: ["CMD", "redis-cli", -a, ${TEST_STATION_REDIS_PASSWORD:?}, PING], interval: 5s, timeout: 5s, retries: 20}
  test-station-frontend:
    image: ${TEST_STATION_FRONTEND_IMAGE:?TEST_STATION_FRONTEND_IMAGE is required}
    networks: [test-station, test-station-gateway]
  test-station-gateway:
    image: nginx:1.27-alpine
    volumes: [./gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [test-station, test-station-gateway]
  test-station-caddy:
    image: caddy:2.10.2-alpine
    ports: ["80:80", "[::]:80:80"]
    volumes: [./Caddyfile.test-station:/etc/caddy/Caddyfile:ro]
    networks: [test-station-gateway]
networks:
  test-station: {name: sub2api-test-station-network, internal: true}
  test-station-gateway: {name: sub2api-test-station-gateway}
volumes:
  test-station-data: {name: sub2api-test-station-data}
  test-station-postgres: {name: sub2api-test-station-postgres}
  test-station-redis: {name: sub2api-test-station-redis}
