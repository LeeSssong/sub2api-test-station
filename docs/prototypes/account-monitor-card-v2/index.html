<!doctype html>
<html lang="zh-CN">
<head>

  <title>账号监控卡片原型 V3</title>
  <style>
    :root { color-scheme: light; --page:#f4f7f9; --surface:#fff; --muted:#6d7888; --subtle:#9aa4b2; --text:#18212f; --border:#dfe6eb; --soft:#f7f9fb; --teal:#12b886; --teal-dark:#087f5b; --teal-soft:#e8faf4; --blue-soft:#edf5ff; --amber-soft:#fff8e7; --violet-soft:#f4efff; --red:#e25555; --shadow:0 7px 24px rgba(30,52,69,.07); font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    * { box-sizing:border-box; } body { margin:0; background:var(--page); color:var(--text); letter-spacing:0; } button,input,select { font:inherit; } button { cursor:pointer; } button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
    .shell { width:min(1240px,calc(100% - 40px)); margin:0 auto; padding:34px 0 56px; } .page-head { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:24px; } h1 { margin:0; font-size:27px; line-height:1.25; font-weight:750; } .page-description { margin:7px 0 0; color:var(--muted); font-size:14px; }
    .refresh-all { display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:0 14px; border:1px solid #079c74; border-radius:8px; background:var(--teal); color:#fff; font-weight:650; } .scope-tabs { display:flex; gap:26px; overflow-x:auto; border-bottom:1px solid var(--border); scrollbar-width:none; } .scope-tab { position:relative; flex:0 0 auto; border:0; background:transparent; color:var(--muted); padding:0 1px 13px; font-size:14px; font-weight:650; } .scope-tab.active { color:var(--teal-dark); } .scope-tab.active::after { content:""; position:absolute; inset:auto 0 -1px; height:3px; border-radius:3px 3px 0 0; background:var(--teal); } .scope-count { display:inline-flex; justify-content:center; min-width:20px; margin-left:6px; border-radius:999px; padding:1px 6px; background:#e8edf1; color:#657180; font-size:11px; } .scope-tab.active .scope-count { background:var(--teal-soft); color:var(--teal-dark); }
    .toolbar { display:grid; grid-template-columns:minmax(240px,1fr) 152px auto; align-items:center; gap:10px; margin:18px 0; } .field { display:flex; align-items:center; min-height:40px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--muted); } .search { gap:9px; padding:0 12px; } .search input { width:100%; border:0; outline:0; background:transparent; color:var(--text); } .status-select { width:100%; border:0; outline:0; background:transparent; color:var(--muted); padding:0 12px; } .range-switch { display:inline-grid; grid-template-columns:repeat(3,1fr); min-width:216px; padding:3px; border:1px solid var(--border); border-radius:8px; background:var(--surface); } .range-button { min-height:32px; border:0; border-radius:6px; background:transparent; color:var(--muted); padding:0 10px; font-size:13px; font-weight:600; } .range-button.active { background:var(--teal-soft); color:var(--teal-dark); }
    .group-summary { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); overflow:hidden; margin:0 0 18px; border:1px solid var(--border); border-radius:8px; background:var(--surface); } .group-item { min-width:0; min-height:82px; padding:13px 14px; } .group-item + .group-item { border-left:1px solid var(--border); } .group-label,.eyebrow,.metric-label,.detail-label { color:var(--muted); font-size:12px; } .group-value { overflow-wrap:anywhere; margin-top:7px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; font-weight:750; } .group-value.active { color:var(--teal-dark); }
    .account-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } .account-card { overflow:hidden; border:1px solid #bfcfd8; border-left:4px solid var(--teal); border-radius:8px; background:var(--surface); box-shadow:var(--shadow); } .account-header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px; border-bottom:1px solid #c9eee2; background:var(--teal-soft); } .identity { min-width:0; } .account-name { margin:0; overflow-wrap:anywhere; font-size:16px; line-height:1.35; font-weight:750; } .account-id { margin-left:6px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; } .status-badge { flex:0 0 auto; border-radius:999px; padding:5px 9px; background:#cef5e5; color:#087b57; font-size:12px; font-weight:750; }
    .card-body { padding:16px 18px 0; } .score-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); overflow:hidden; border:1px solid var(--border); border-radius:8px; background:var(--soft); } .score-cell { min-width:0; min-height:121px; padding:14px; } .score-cell + .score-cell { border-left:1px solid var(--border); } .score-line { display:flex; align-items:baseline; gap:6px; min-height:34px; margin-top:5px; } .score-value { overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:25px; line-height:1; font-weight:800; } .score-unit { color:var(--muted); font-size:12px; font-weight:650; } .score-help { margin:7px 0 0; color:var(--subtle); font-size:11px; line-height:1.4; } .priority-editor { display:flex; align-items:center; gap:3px; } .priority-input,.cost-input { min-width:0; width:76px; height:32px; border:1px solid #91d8c3; border-radius:6px; padding:0 7px; background:#fff; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:750; } .edit-error { margin-top:5px; color:var(--red); font-size:11px; line-height:1.35; }
    .metric-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; margin-top:14px; } .metric { min-width:0; min-height:116px; padding:12px; border:1px solid var(--border); border-radius:8px; } .metric.success { border-color:#bcebdc; background:var(--teal-soft); } .metric.ttft { border-color:#cfe1fb; background:var(--blue-soft); } .metric.latency { border-color:#f2dfac; background:var(--amber-soft); } .metric.cost { border-color:#dfd2fb; background:var(--violet-soft); } .metric.concurrency { background:var(--soft); } .metric-value { overflow-wrap:anywhere; margin-top:8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:18px; line-height:1.2; font-weight:800; font-variant-numeric:tabular-nums; } .metric-detail { margin-top:7px; color:var(--subtle); font-size:11px; line-height:1.35; } .cost-actions { display:flex; align-items:center; gap:2px; margin-top:6px; } .cost-editor { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:7px; }
    .probe-section { margin-top:16px; border-top:1px solid #edf1f4; padding:15px 0; } .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; } .section-title { margin:0; font-size:14px; font-weight:700; } .section-meta { color:var(--subtle); font-size:11px; } .probe-bars { display:grid; grid-template-columns:repeat(24,minmax(3px,1fr)); align-items:end; gap:4px; height:36px; margin-top:11px; } .probe-bar { min-height:7px; border-radius:3px 3px 2px 2px; background:var(--teal); } .probe-bar.failed { background:var(--red); } .probe-axis { display:flex; justify-content:space-between; margin-top:4px; color:var(--subtle); font-size:10px; }
    .calls-disclosure { border-top:1px solid #edf1f4; } .calls-toggle { display:flex; align-items:center; width:100%; min-height:47px; padding:0; border:0; background:transparent; color:var(--text); text-align:left; } .calls-title { font-size:14px; font-weight:700; } .calls-summary { margin-left:8px; color:var(--muted); font-size:11px; } .calls-toggle svg { margin-left:auto; color:var(--subtle); } .calls-toggle[aria-expanded="true"] svg { transform:rotate(180deg); } .calls-detail { display:none; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 0 14px; } .calls-detail.open { display:grid; } .detail-item { border-radius:7px; padding:10px; background:var(--soft); } .detail-value { margin-top:4px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; font-weight:750; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; border-top:1px solid #edf1f4; color:var(--muted); font-size:11px; } .footer-actions { display:flex; gap:3px; } .icon-button { display:inline-flex; align-items:center; justify-content:center; width:31px; height:31px; padding:0; border:0; border-radius:7px; background:transparent; color:#405062; } .icon-button:hover { background:#edf2f5; } .scope-caption { margin:12px 2px 0; color:var(--subtle); font-size:11px; }
    @media (max-width: 900px) { .account-grid { grid-template-columns:1fr; } .group-summary { grid-template-columns:repeat(4,minmax(0,1fr)); } .group-item:nth-child(5) { border-left:0; border-top:1px solid var(--border); } .group-item:nth-child(n+6) { border-top:1px solid var(--border); } }
    @media (max-width:760px) { .shell { width:min(100% - 24px,1240px); padding-top:22px; } .page-head { align-items:flex-start; } .page-description { max-width:34ch; } .refresh-all span { display:none; } .toolbar { grid-template-columns:1fr 118px; } .range-switch { grid-column:1 / -1; min-width:0; } .score-strip { grid-template-columns:repeat(3,minmax(0,1fr)); } .score-cell { min-height:114px; padding:12px 9px; } .score-value { font-size:21px; } .metric-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .calls-detail { grid-template-columns:1fr; } .card-footer { align-items:flex-start; padding:9px 0; } }
    @media (max-width:430px) { h1 { font-size:23px; } .toolbar { grid-template-columns:1fr; } .range-switch { grid-column:auto; } .group-summary { grid-template-columns:repeat(2,minmax(0,1fr)); } .group-item { border-top:1px solid var(--border); } .group-item:nth-child(odd) { border-left:0; } .group-item:nth-child(-n+2) { border-top:0; } .account-header { align-items:flex-start; padding:14px; } .card-body { padding:14px 14px 0; } .score-cell { padding:11px 8px; } .score-help { font-size:10px; } .metric-grid { grid-template-columns:1fr; } .card-footer { flex-direction:column; gap:3px; } .footer-actions { align-self:flex-end; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="page-head"><div><h1>账号监控</h1><p class="page-description">按分组比较账号服务质量、评分与调度优先级。</p></div><button class="refresh-all" type="button" title="立即刷新全部账号" aria-label="立即刷新全部账号" onclick="refreshAll()"><i data-lucide="refresh-cw" aria-hidden="true"></i><span>立即刷新全部</span></button></header>
    <nav class="scope-tabs" aria-label="账号分组" role="tablist"><button class="scope-tab" type="button" role="tab" aria-selected="false" data-scope="all">全站<span class="scope-count">2</span></button><button class="scope-tab active" type="button" role="tab" aria-selected="true" data-scope="group">GPT-PLUS-内测<span class="scope-count">2</span></button></nav>
    <section class="toolbar" aria-label="账号筛选"><label class="field search"><i data-lucide="search" aria-hidden="true"></i><input id="search-input" type="search" placeholder="搜索账号名称或 ID" aria-label="搜索账号名称或 ID"></label><label class="field"><select id="status-select" class="status-select" aria-label="账号状态"><option>全部状态</option><option>正常</option><option>不可用</option><option>待确认</option><option>暂停</option></select></label><div class="range-switch" role="group" aria-label="统计时间范围"><button class="range-button active" type="button" data-range="24h">24 小时</button><button class="range-button" type="button" data-range="7d">7 天</button><button class="range-button" type="button" data-range="30d">30 天</button></div></section>
    <section id="group-summary-container"></section><section id="account-grid" class="account-grid" aria-label="账号排名卡片"></section><p class="scope-caption">原型口径：真实请求与独立探测分开披露；采购成本按当前窗口展示等效倍率。</p>
  </main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    const state = {
      scope: "group", range: "24h",
      group: { name: "GPT-PLUS-内测", status: "active", platform: "openai", rateMultiplier: 1.2, rpmLimit: 120, accountCount: 2, activeAccountCount: 2, rateLimitedAccountCount: 0 },
      accounts: [
        { accountId: 113, name: "93_dowel.paddler@icloud.com", status: "正常", priority: 1, concurrency: 3, maxConcurrency: 10, procurementCostCny: 120, expiresAt: "2026-09-01", multiplier: 0.58, multiplierPolicy: "manual", windows: { "24h": { score: 91, groupRank: 1, requests: 72, failures: 1, successRate: "98.6%", ttft: "1018 ms", latency: "1962 ms", effectiveMultiplier: "0.48×" }, "7d": { score: 89, groupRank: 1, requests: 426, failures: 8, successRate: "98.1%", ttft: "1094 ms", latency: "2280 ms", effectiveMultiplier: "0.51×" }, "30d": { score: 86, groupRank: 1, requests: 1324, failures: 31, successRate: "97.7%", ttft: "1188 ms", latency: "2614 ms", effectiveMultiplier: "0.56×" } } },
        { accountId: 207, name: "upstream-codex-02", status: "正常", priority: 2, concurrency: 1, maxConcurrency: 8, procurementCostCny: null, expiresAt: null, multiplier: 0.62, multiplierPolicy: "upstream_managed", windows: { "24h": { score: 87, groupRank: 2, requests: 51, failures: 2, successRate: "96.1%", ttft: "1120 ms", latency: "2180 ms", effectiveMultiplier: "0.62×" }, "7d": { score: 85, groupRank: 2, requests: 338, failures: 11, successRate: "96.7%", ttft: "1175 ms", latency: "2390 ms", effectiveMultiplier: "0.62×" }, "30d": { score: 83, groupRank: 2, requests: 1098, failures: 39, successRate: "96.4%", ttft: "1240 ms", latency: "2790 ms", effectiveMultiplier: "0.62×" } } }
      ]
    };
    const ui = { priorityEditId: null, costEditId: null, errors: {}, search: "", status: "全部状态", checkedAt: {} };
    function icon(name) { return `<i data-lucide="${name}" aria-hidden="true"></i>`; }
    function compareAccounts(left, right) { const leftRank = left.windows[state.range].groupRank; const rightRank = right.windows[state.range].groupRank; if (leftRank == null && rightRank == null) return left.accountId - right.accountId; if (leftRank == null) return 1; if (rightRank == null) return -1; return leftRank - rightRank || left.accountId - right.accountId; }
    function renderGroupSummary() { const container = document.getElementById("group-summary-container"); if (state.scope !== "group") { container.innerHTML = ""; return; } const fields = [["分组状态", "启用"], ["平台", state.group.platform], ["分组倍率", `${state.group.rateMultiplier.toFixed(2)}×`], ["RPM 上限", state.group.rpmLimit], ["原生账号数", state.group.accountCount], ["原生活跃账号数", state.group.activeAccountCount], ["原生限流账号数", state.group.rateLimitedAccountCount]]; container.innerHTML = `<div class="group-summary" aria-label="${state.group.name} 原生分组汇总">${fields.map(([label, value], index) => `<div class="group-item"><div class="group-label">${label}</div><div class="group-value${index === 0 ? " active" : ""}">${value}</div></div>`).join("")}</div>`; }
    function renderCost(account) { if (account.procurementCostCny != null) { const window = account.windows[state.range]; if (!account.expiresAt) return { value: `¥${account.procurementCostCny.toFixed(2)}`, detail: "有效期缺失 · 无法计算等效倍率" }; return { value: `¥${account.procurementCostCny.toFixed(2)}`, detail: `有效至 ${account.expiresAt} · 当前窗口等效倍率 ${window.effectiveMultiplier}` }; } return { value: `${account.multiplier.toFixed(2)}×`, detail: account.multiplierPolicy === "upstream_managed" ? "上游托管倍率" : "手动倍率" }; }
    function probeBars(account) { const heights = [48,55,72,63,66,51,58,64,61,67,70,59,78,62,82,74,86,68,76,83,72,66,74,58]; return heights.map((height, index) => `<span class="probe-bar${index === (account.accountId === 113 ? 7 : 16) ? " failed" : ""}" style="height:${height}%" title="${index === (account.accountId === 113 ? 7 : 16) ? "探测失败" : "探测成功"}"></span>`).join(""); }
    function priorityMarkup(account) { if (ui.priorityEditId !== account.accountId) return `<div class="score-line"><strong class="score-value">${account.priority}</strong><button class="icon-button" type="button" title="编辑全局优先级" aria-label="编辑全局优先级" onclick="beginPriorityEdit(${account.accountId})">${icon("pencil")}</button></div><p class="score-help">数值越小，调度优先级越高</p>`; return `<div class="priority-editor"><input class="priority-input" id="priority-input-${account.accountId}" type="number" min="1" step="1" value="${account.priority}" aria-label="全局优先级"><button class="icon-button" type="button" title="保存全局优先级" aria-label="保存全局优先级" onclick="savePriority(${account.accountId})">${icon("check")}</button><button class="icon-button" type="button" title="取消编辑全局优先级" aria-label="取消编辑全局优先级" onclick="cancelPriorityEdit(${account.accountId})">${icon("x")}</button></div>${ui.errors[`priority-${account.accountId}`] ? `<div class="edit-error">${ui.errors[`priority-${account.accountId}`]}</div>` : ""}`; }
    function costMarkup(account, cost) { if (ui.costEditId === account.accountId) return `<div class="cost-editor"><input class="cost-input" id="cost-input-${account.accountId}" type="number" min="0" step="0.01" value="${account.procurementCostCny ?? ""}" aria-label="采购成本（人民币）"><button class="icon-button" type="button" title="保存采购成本" aria-label="保存采购成本" onclick="saveCost(${account.accountId})">${icon("check")}</button><button class="icon-button" type="button" title="取消编辑采购成本" aria-label="取消编辑采购成本" onclick="cancelCostEdit(${account.accountId})">${icon("x")}</button></div>${ui.errors[`cost-${account.accountId}`] ? `<div class="edit-error">${ui.errors[`cost-${account.accountId}`]}</div>` : ""}`; if (account.procurementCostCny != null) return `<div class="cost-actions"><button class="icon-button" type="button" title="编辑采购成本" aria-label="编辑采购成本" onclick="beginCostEdit(${account.accountId})">${icon("pencil")}</button><button class="icon-button" type="button" title="清空采购成本" aria-label="清空采购成本" onclick="clearCost(${account.accountId})">${icon("trash-2")}</button></div>`; return `<div class="cost-actions"><button class="icon-button" type="button" title="录入采购成本" aria-label="录入采购成本" onclick="beginCostEdit(${account.accountId})">${icon("pencil")}</button></div>`; }
    function renderCard(account) { const w = account.windows[state.range]; const cost = renderCost(account); const open = document.getElementById(`calls-detail-${account.accountId}`)?.classList.contains("open") || false; const checkedAt = ui.checkedAt[account.accountId] || "2026/8/4 12:20:42"; const rankLabel = state.scope === "group" ? "组内排名" : "全站排名"; const scoreLabel = state.scope === "group" ? "账号分组评分" : "账号服务评分"; return `<article class="account-card" data-account-id="${account.accountId}"><header class="account-header"><div class="identity"><h2 class="account-name">${account.name}<span class="account-id">#${account.accountId}</span></h2></div><span class="status-badge">${account.status}</span></header><div class="card-body"><section class="score-strip" aria-label="评分排名与优先级"><div class="score-cell"><div class="eyebrow">${scoreLabel}</div><div class="score-line"><strong class="score-value">${w.score}</strong><span class="score-unit">/ 100</span></div><p class="score-help">基于 ${w.requests} 次真实请求</p></div><div class="score-cell"><div class="eyebrow">${rankLabel}</div><div class="score-line"><strong class="score-value">第 ${w.groupRank}</strong><span class="score-unit">/ 2</span></div><p class="score-help">正常可用账号继续参与排名</p></div><div class="score-cell"><div class="eyebrow">全局优先级</div>${priorityMarkup(account)}</div></section><section class="metric-grid" aria-label="账号服务指标"><div class="metric success"><div class="metric-label">成功率</div><div class="metric-value">${w.successRate}</div><div class="metric-detail">${w.requests} 次真实请求，${w.failures} 次失败</div></div><div class="metric ttft"><div class="metric-label">TTFT P50</div><div class="metric-value">${w.ttft}</div><div class="metric-detail">基于 ${w.requests - w.failures} 次有效响应</div></div><div class="metric latency"><div class="metric-label">总耗时 P95</div><div class="metric-value">${w.latency}</div><div class="metric-detail">基于 ${w.requests - w.failures} 次有效响应</div></div><div class="metric cost"><div class="metric-label">账号成本</div><div class="metric-value">${cost.value}</div><div class="metric-detail">${cost.detail}</div>${costMarkup(account, cost)}</div><div class="metric concurrency"><div class="metric-label">当前并发</div><div class="metric-value" data-concurrency-account-id="${account.accountId}">${account.concurrency} / ${account.maxConcurrency}</div><div class="metric-detail">近实时运维快照</div></div></section><section class="probe-section" aria-label="近期探测"><div class="section-head"><h3 class="section-title">近期探测</h3><span class="section-meta">24 次结果 · 23 成功 · 1 失败</span></div><div class="probe-bars" role="img" aria-label="最近 24 次独立探测结果">${probeBars(account)}</div><div class="probe-axis"><span>较早</span><span>最近</span></div></section><section class="calls-disclosure"><button class="calls-toggle" type="button" aria-expanded="${open}" aria-controls="calls-detail-${account.accountId}" onclick="toggleCalls(${account.accountId})"><span class="calls-title">${state.range === "24h" ? "24 小时" : state.range === "7d" ? "7 天" : "30 天"}调用</span><span class="calls-summary">${w.requests} 次请求 · ${w.failures} 次失败</span>${icon("chevron-down")}</button><div class="calls-detail${open ? " open" : ""}" id="calls-detail-${account.accountId}"><div class="detail-item"><div class="detail-label">成功请求</div><div class="detail-value">${w.requests - w.failures}</div></div><div class="detail-item"><div class="detail-label">失败请求</div><div class="detail-value">${w.failures}</div></div><div class="detail-item"><div class="detail-label">探测失败</div><div class="detail-value">1（不计入请求失败）</div></div></div></section><footer class="card-footer"><span>检查于 ${checkedAt} · 统计截止 12:20</span><div class="footer-actions"><button class="icon-button" type="button" title="刷新当前账号" aria-label="刷新当前账号" onclick="refreshAccount(${account.accountId})">${icon("refresh-cw")}</button></div></footer></div></article>`; }
    function renderCards() { const grid = document.getElementById("account-grid"); const accounts = state.accounts.filter((account) => account.status === ui.status || ui.status === "全部状态").filter((account) => `${account.name} ${account.accountId}`.toLowerCase().includes(ui.search.toLowerCase())).sort(compareAccounts); grid.innerHTML = accounts.map(renderCard).join("") || `<p class="scope-caption">没有符合筛选条件的账号。</p>`; if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16, "stroke-width": 1.8 } }); }
    function render() { renderGroupSummary(); renderCards(); }
    function setRange(range) { state.range = range; document.querySelectorAll(".range-button").forEach((button) => button.classList.toggle("active", button.dataset.range === range)); render(); }
    function beginPriorityEdit(accountId) { ui.priorityEditId = accountId; ui.errors[`priority-${accountId}`] = ""; renderCards(); document.getElementById(`priority-input-${accountId}`)?.focus(); }
    function savePriority(accountId) { const value = Number(document.getElementById(`priority-input-${accountId}`).value); if (!Number.isInteger(value) || value < 1) { ui.errors[`priority-${accountId}`] = "请输入大于或等于 1 的整数"; renderCards(); return; } state.accounts.find((account) => account.accountId === accountId).priority = value; ui.priorityEditId = null; ui.errors[`priority-${accountId}`] = ""; renderCards(); }
    function cancelPriorityEdit(accountId) { ui.priorityEditId = null; ui.errors[`priority-${accountId}`] = ""; renderCards(); }
    function beginCostEdit(accountId) { ui.costEditId = accountId; ui.errors[`cost-${accountId}`] = ""; renderCards(); document.getElementById(`cost-input-${accountId}`)?.focus(); }
    function saveCost(accountId) { const value = Number(document.getElementById(`cost-input-${accountId}`).value); if (!Number.isFinite(value) || value < 0 || document.getElementById(`cost-input-${accountId}`).value.trim() === "") { ui.errors[`cost-${accountId}`] = "请输入大于或等于 0 的采购成本"; renderCards(); return; } const account = state.accounts.find((item) => item.accountId === accountId); account.procurementCostCny = value; account.procurementCostEffectiveAt = "2026-08-04"; ui.costEditId = null; ui.errors[`cost-${accountId}`] = ""; renderCards(); }
    function cancelCostEdit(accountId) { ui.costEditId = null; ui.errors[`cost-${accountId}`] = ""; renderCards(); }
    function clearCost(accountId) { if (!window.confirm("确认清空采购成本并恢复倍率模式？")) return; const account = state.accounts.find((item) => item.accountId === accountId); account.procurementCostCny = null; account.procurementCostEffectiveAt = null; renderCards(); }
    function applyFilters() { ui.search = document.getElementById("search-input").value; ui.status = document.getElementById("status-select").value; renderCards(); }
    function toggleCalls(accountId) { const button = document.querySelector(`[aria-controls="calls-detail-${accountId}"]`); const detail = document.getElementById(`calls-detail-${accountId}`); const open = button.getAttribute("aria-expanded") !== "true"; button.setAttribute("aria-expanded", String(open)); detail.classList.toggle("open", open); }
    function refreshAccount(accountId) { ui.checkedAt[accountId] = new Date().toLocaleString("zh-CN", { hour12: false }); renderCards(); }
    function refreshAll() { state.accounts.forEach((account) => { ui.checkedAt[account.accountId] = new Date().toLocaleString("zh-CN", { hour12: false }); }); renderCards(); }
    function tickConcurrency() { state.accounts.forEach((account, index) => { const delta = index === 0 ? 1 : -1; account.concurrency = Math.max(0, Math.min(account.maxConcurrency, account.concurrency + delta)); }); renderConcurrencyOnly(); }
    function renderConcurrencyOnly() { state.accounts.forEach((account) => { document.querySelectorAll(`[data-concurrency-account-id="${account.accountId}"]`).forEach((node) => { node.textContent = `${account.concurrency} / ${account.maxConcurrency}`; }); }); }
    function startConcurrencyTicker() { window.setInterval(() => { if (document.visibilityState === "visible") tickConcurrency(); }, 5000); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tickConcurrency(); }); }
    document.querySelectorAll(".range-button").forEach((button) => button.addEventListener("click", () => setRange(button.dataset.range)));
    document.querySelectorAll(".scope-tab").forEach((button) => button.addEventListener("click", () => { state.scope = button.dataset.scope; document.querySelectorAll(".scope-tab").forEach((tab) => { const selected = tab === button; tab.classList.toggle("active", selected); tab.setAttribute("aria-selected", String(selected)); }); render(); }));
    document.getElementById("search-input").addEventListener("input", applyFilters); document.getElementById("status-select").addEventListener("change", applyFilters); render(); startConcurrencyTicker();
  </script>
</body>
