name: sub2api

x-sub2api-environment: &sub2api-environment
  AUTO_SETUP: "true"
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8080"
  SERVER_MODE: release
  RUN_MODE: standard
  SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES:-172.16.0.0/12}
  SERVER_MAX_REQUEST_BODY_SIZE: ${SERVER_MAX_REQUEST_BODY_SIZE:-134217728}
  GATEWAY_MAX_BODY_SIZE: ${GATEWAY_MAX_BODY_SIZE:-134217728}
  GATEWAY_TEXT_MAX_BODY_SIZE: ${GATEWAY_TEXT_MAX_BODY_SIZE:-16777216}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
  DATABASE_DBNAME: ${POSTGRES_DB}
  DATABASE_SSLMODE: disable
  DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
  DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  REDIS_DB: "0"
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-64}
  REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-5}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
  JWT_SECRET: ${JWT_SECRET:?required}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
  TZ: ${TZ:-Asia/Shanghai}
  SUB2API_MODEL_DETECTOR_URL: ${SUB2API_MODEL_DETECTOR_URL:-http://model-detector:8090}
  SUB2API_MODEL_DETECTOR_TOKEN: ${SUB2API_MODEL_DETECTOR_TOKEN:-}
  SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-false}
  SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-true}
  SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-true}
  SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}

  # OpenAI low-latency relay baseline. These are global gateway settings;
  # no account credentials or account-specific fields are configured here.
  GATEWAY_OPENAI_WS_ENABLED: ${GATEWAY_OPENAI_WS_ENABLED:-true}
  GATEWAY_OPENAI_WS_RESPONSES_WEBSOCKETS_V2: ${GATEWAY_OPENAI_WS_RESPONSES_WEBSOCKETS_V2:-true}
  GATEWAY_OPENAI_WS_MIN_IDLE_PER_ACCOUNT: ${GATEWAY_OPENAI_WS_MIN_IDLE_PER_ACCOUNT:-4}
  GATEWAY_OPENAI_WS_MAX_IDLE_PER_ACCOUNT: ${GATEWAY_OPENAI_WS_MAX_IDLE_PER_ACCOUNT:-12}
  GATEWAY_OPENAI_WS_DYNAMIC_MAX_CONNS_BY_ACCOUNT_CONCURRENCY_ENABLED: ${GATEWAY_OPENAI_WS_DYNAMIC_MAX_CONNS_BY_ACCOUNT_CONCURRENCY_ENABLED:-true}
  GATEWAY_OPENAI_WS_POOL_TARGET_UTILIZATION: ${GATEWAY_OPENAI_WS_POOL_TARGET_UTILIZATION:-0.70}
  GATEWAY_OPENAI_WS_QUEUE_LIMIT_PER_CONN: ${GATEWAY_OPENAI_WS_QUEUE_LIMIT_PER_CONN:-16}
  GATEWAY_OPENAI_WS_EVENT_FLUSH_BATCH_SIZE: ${GATEWAY_OPENAI_WS_EVENT_FLUSH_BATCH_SIZE:-1}
  GATEWAY_OPENAI_WS_EVENT_FLUSH_INTERVAL_MS: ${GATEWAY_OPENAI_WS_EVENT_FLUSH_INTERVAL_MS:-10}
  GATEWAY_OPENAI_WS_STORE_DISABLED_CONN_MODE: ${GATEWAY_OPENAI_WS_STORE_DISABLED_CONN_MODE:-strict}
  GATEWAY_OPENAI_WS_STORE_DISABLED_FORCE_NEW_CONN: ${GATEWAY_OPENAI_WS_STORE_DISABLED_FORCE_NEW_CONN:-true}
  GATEWAY_OPENAI_WS_PREWARM_GENERATE_ENABLED: ${GATEWAY_OPENAI_WS_PREWARM_GENERATE_ENABLED:-false}
  GATEWAY_OPENAI_WS_LB_TOP_K: ${GATEWAY_OPENAI_WS_LB_TOP_K:-7}
  GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_QUEUE: ${GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_QUEUE:-1.2}
  GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_ERROR_RATE: ${GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_ERROR_RATE:-1.2}
  GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_TTFT: ${GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_TTFT:-1.5}
  GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_ENABLED: ${GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_ENABLED:-true}
  GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_TTFT_MS: ${GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_TTFT_MS:-8000}
  GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_ERROR_RATE: ${GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_ERROR_RATE:-0.30}
  GATEWAY_OPENAI_HTTP2_ENABLED: ${GATEWAY_OPENAI_HTTP2_ENABLED:-true}
  GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1: ${GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1:-true}

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  model-detector:
    image: ${SUB2API_MODEL_DETECTOR_IMAGE:-${SUB2API_BLUE_IMAGE:?SUB2API_BLUE_IMAGE is required}}
    restart: unless-stopped
    command: ["/app/model-detector"]
    expose: ["8090"]
    environment:
      MODEL_DETECTOR_LISTEN_ADDRESS: ":8090"
      MODEL_DETECTOR_MODELS: ${MODEL_DETECTOR_MODELS:-gpt-5.6-terra,gpt-5.6-sol,gpt-5.4,gpt-5.6,gpt-5.6-codex,claude-3-7-sonnet}
      MODEL_DETECTOR_VERSION: ${MODEL_DETECTOR_VERSION:-4.1.1}
      SUB2API_MODEL_DETECTOR_TOKEN: ${SUB2API_MODEL_DETECTOR_TOKEN:?required}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    logging: *logging

  sub2api-blue:
    image: ${SUB2API_BLUE_IMAGE:?SUB2API_BLUE_IMAGE is required}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      <<: *sub2api-environment
      SERVER_PROCESS_ROLE: api
    volumes:
      - type: bind
        source: ${SUB2API_DATA_DIR:?SUB2API_DATA_DIR is required}
        target: /app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      model-detector: {condition: service_healthy}
    healthcheck: &sub2api-healthcheck
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging: *logging

  sub2api-green:
    image: ${SUB2API_GREEN_IMAGE:?SUB2API_GREEN_IMAGE is required}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      <<: *sub2api-environment
      SERVER_PROCESS_ROLE: api
    volumes:
      - type: bind
        source: ${SUB2API_DATA_DIR:?SUB2API_DATA_DIR is required}
        target: /app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      model-detector: {condition: service_healthy}
    healthcheck: *sub2api-healthcheck
    logging: *logging

  sub2api-worker:
    image: ${SUB2API_WORKER_IMAGE:?SUB2API_WORKER_IMAGE is required}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      <<: *sub2api-environment
      SERVER_PROCESS_ROLE: worker
    volumes:
      - type: bind
        source: ${SUB2API_DATA_DIR:?SUB2API_DATA_DIR is required}
        target: /app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      model-detector: {condition: service_healthy}
    healthcheck: *sub2api-healthcheck
    logging: *logging
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-60}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}", "-c", "effective_cache_size=512MB", "-c", "maintenance_work_mem=32MB"]
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR is required}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging

  relay-ops:
    image: ${RELAY_OPS_IMAGE:-sub2api-relay-ops:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.relay-ops
    restart: unless-stopped
    expose: ["8100"]
    environment:
      RELAY_OPS_MODE: ${RELAY_OPS_MODE:-read_only}
      RELAY_OPS_ACCOUNTING_ENABLED: ${RELAY_OPS_ACCOUNTING_ENABLED:-false}
      RELAY_OPS_ACCOUNTING_LEDGER_START_DATE: ${RELAY_OPS_ACCOUNTING_LEDGER_START_DATE:-}
      RELAY_OPS_ACCOUNTING_INTERNAL_USER_IDS: ${RELAY_OPS_ACCOUNTING_INTERNAL_USER_IDS:-}
      RELAY_OPS_ACCOUNTING_INTERNAL_API_KEY_IDS: ${RELAY_OPS_ACCOUNTING_INTERNAL_API_KEY_IDS:-}
      RELAY_OPS_CANDIDATE_SECRET_DIR: /var/lib/relay-ops/candidate-keys
      RELAY_OPS_LISTEN_ADDRESS: :8100
      RELAY_OPS_TIMEZONE: Asia/Shanghai
      RELAY_OPS_PUBLIC_BASE_URL: https://${SITE_ADDRESS}
      RELAY_OPS_DATABASE_URL_FILE: /run/secrets/relay-ops-database-url
      RELAY_OPS_SUB2API_URL: http://caddy:8081
      RELAY_OPS_TRUSTED_PROXY_HOST: caddy
      RELAY_OPS_SUB2API_ADMIN_KEY_FILE: /run/secrets/sub2api-admin-api-key
      RELAY_OPS_ACCOUNT_QUALITY_RESULT_FILE: /run/relay-ops/account-quality/account-quality-result.json
      RELAY_OPS_UPSTREAM_GROUP_MAPPING_FILE: ${RELAY_OPS_UPSTREAM_GROUP_MAPPING_FILE:-}
      RELAY_OPS_FEISHU_WEBHOOK_FILE: ${RELAY_OPS_FEISHU_WEBHOOK_FILE:-}
      RELAY_OPS_FEISHU_APP_ID_FILE: ${RELAY_OPS_FEISHU_APP_ID_FILE:-}
      RELAY_OPS_FEISHU_APP_SECRET_FILE: ${RELAY_OPS_FEISHU_APP_SECRET_FILE:-}
      RELAY_OPS_FEISHU_ALERT_CHAT_ID_FILE: ${RELAY_OPS_FEISHU_ALERT_CHAT_ID_FILE:-}
      RELAY_OPS_FEISHU_ALERT_RECIPIENTS_FILE: ${RELAY_OPS_FEISHU_ALERT_RECIPIENTS_FILE:-}
      RELAY_OPS_NOTIFICATION_POLICY_FILE: ${RELAY_OPS_NOTIFICATION_POLICY_FILE:-}
      RELAY_OPS_AGENT_BASE_URL: ${RELAY_OPS_AGENT_BASE_URL:-}
      RELAY_OPS_AGENT_API_KEY_FILE: /run/secrets/agent-api-key
      RELAY_OPS_AGENT_MODEL: ${RELAY_OPS_AGENT_MODEL:-}
    volumes:
      - ${RELAY_OPS_DATABASE_URL_HOST_FILE:-./secrets/relay-ops-database-url}:/run/secrets/relay-ops-database-url:ro
      - ${RELAY_OPS_SUB2API_ADMIN_KEY_HOST_FILE:-./secrets/sub2api-admin-api-key}:/run/secrets/sub2api-admin-api-key:ro
      - ${RELAY_OPS_ACCOUNT_QUALITY_RESULT_HOST_DIR:-/dev/null}:/run/relay-ops/account-quality:ro
      - ${RELAY_OPS_UPSTREAM_GROUP_MAPPING_HOST_FILE:-/dev/null}:/run/relay-ops/upstream-group-mapping.json:ro
      - ${RELAY_OPS_FEISHU_WEBHOOK_HOST_FILE:-/dev/null}:/run/secrets/feishu-webhook:ro
      - ${RELAY_OPS_FEISHU_APP_ID_HOST_FILE:-/dev/null}:/run/secrets/feishu-app-id:ro
      - ${RELAY_OPS_FEISHU_APP_SECRET_HOST_FILE:-/dev/null}:/run/secrets/feishu-app-secret:ro
      - ${RELAY_OPS_FEISHU_ALERT_CHAT_ID_HOST_FILE:-/dev/null}:/run/secrets/feishu-alert-chat-id:ro
      - ${RELAY_OPS_FEISHU_ALERT_RECIPIENTS_HOST_FILE:-/dev/null}:/run/secrets/feishu-alert-recipients.json:ro
      - ${RELAY_OPS_NOTIFICATION_POLICY_HOST_FILE:-/dev/null}:/run/relay-ops/notification-policy.json:ro
      - ${RELAY_OPS_AGENT_API_KEY_HOST_FILE:-./secrets/agent-api-key}:/run/secrets/agent-api-key:ro
      - ${RELAY_OPS_CANDIDATE_KEYS_HOST_DIR:-./secrets/candidate-keys}:/run/secrets/candidates:ro
      - ${RELAY_OPS_CANDIDATE_MANAGED_KEYS_HOST_DIR:-./secrets/candidate-managed-keys}:/var/lib/relay-ops/candidate-keys:rw
      - ${RELAY_OPS_USAGE_SESSIONS_HOST_DIR:-./secrets/upstream-sessions}:/run/secrets/upstream-sessions:ro
    read_only: true
    tmpfs: [/tmp]
    user: "10002:10002"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 0.75
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging

  # This profile is deliberately separate from the read-only /ops service.
  # Invoke it only through ops/provision-billing-source.sh as root.
  relay-ops-provision:
    profiles: ["provision"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.relay-ops
    restart: "no"
    entrypoint: ["/provision-billing-source"]
    environment:
      RELAY_OPS_MODE: closed
      RELAY_OPS_TIMEZONE: Asia/Shanghai
      RELAY_OPS_DATABASE_URL_FILE: /run/secrets/relay-ops-database-url
      RELAY_OPS_SUB2API_ADMIN_KEY_FILE: /run/secrets/sub2api-admin-api-key
    volumes:
      - ${RELAY_OPS_DATABASE_URL_HOST_FILE:-./secrets/relay-ops-database-url}:/run/secrets/relay-ops-database-url:ro
      - ${RELAY_OPS_SUB2API_ADMIN_KEY_HOST_FILE:-./secrets/sub2api-admin-api-key}:/run/secrets/sub2api-admin-api-key:ro
      - ${RELAY_OPS_USAGE_SESSIONS_HOST_DIR:-./secrets/upstream-sessions}:/run/secrets/upstream-sessions:ro
      - ${RELAY_OPS_BILLING_SOURCE_DECLARATION_HOST_FILE:-/dev/null}:/run/secrets/billing-source-declaration.json:ro
    read_only: true
    tmpfs: [/tmp]
    user: "0:0"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 192m
    cpus: 0.25
    logging: *logging

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --save 60 1 --appendonly yes --appendfsync everysec --maxclients ${REDIS_MAXCLIENTS:-1000} --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${REDIS_DATA_DIR:?REDIS_DATA_DIR is required}
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.caddy
    image: xingqiao-caddy:homepage-20260725-v8-detailed-guide
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?required}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-172.30.0.3/32}
      SUB2API_ACTIVE_UPSTREAM: ${SUB2API_ACTIVE_UPSTREAM:?SUB2API_ACTIVE_UPSTREAM is required}
      ACCEPTANCE_LAB_UPSTREAM: ${ACCEPTANCE_LAB_UPSTREAM:-host.docker.internal:8181}
      ACCEPTANCE_LAB_ALLOWED_IPS: ${ACCEPTANCE_LAB_ALLOWED_IPS:-127.0.0.1/32}
    command:
      - /bin/sh
      - -ec
      - |
        SUB2API_ACTIVE_UPSTREAM=$$(awk -F= '$$1 == "SUB2API_ACTIVE_UPSTREAM" { value=$$2; count++ } END { if (count != 1) exit 1; print value }' /run/sub2api-release/release.env)
        export SUB2API_ACTIVE_UPSTREAM
        case "$$SUB2API_ACTIVE_UPSTREAM" in
          sub2api-blue:8080|sub2api-green:8080) ;;
          *)
            echo "invalid SUB2API_ACTIVE_UPSTREAM: $$SUB2API_ACTIVE_UPSTREAM" >&2
            exit 64
            ;;
        esac
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    expose: ["80", "443", "8081"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SUB2API_RELEASE_ENV_FILE:?SUB2API_RELEASE_ENV_FILE is required}:/run/sub2api-release/release.env:ro
      - ./sub2api-update-ui:/srv/sub2api-update-ui:ro
      - /run/sub2api-updater:/run/sub2api-updater:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default: {}
      tls_front:
        ipv4_address: 172.30.0.2
        aliases: [caddy-tls-origin]
    logging: *logging

  nginx-tls-front:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      caddy: {condition: service_healthy}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?required}
      NGINX_TLS_CERT_ROOT: /data/caddy/certificates
      NGINX_TLS_CERT_SOURCE: ${NGINX_TLS_CERT_SOURCE:-}
      NGINX_TLS_KEY_SOURCE: ${NGINX_TLS_KEY_SOURCE:-}
      NGINX_TLS_CERT_FILE: /run/nginx-tls/${SITE_ADDRESS}.crt
      NGINX_TLS_KEY_FILE: /run/nginx-tls/${SITE_ADDRESS}.key
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx-tls-front.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-tls-front-entrypoint.sh:/usr/local/bin/nginx-tls-front-entrypoint.sh:ro
      - caddy_data:/data:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-tls-front-entrypoint.sh"]
    networks:
      tls_front:
        ipv4_address: 172.30.0.3
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header=\"Host: $$SITE_ADDRESS\" -q -T 5 -O /dev/null https://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

volumes:
  caddy_data:
  caddy_config:

networks:
  tls_front:
    ipam:
      config:
        - subnet: 172.30.0.0/29
