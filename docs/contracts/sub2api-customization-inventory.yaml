      - /admin/accounts/monitor
    source_of_truth:
      - upstream balance/billing probe response with capture timestamp
      - accounts.rate_multiplier and billing sync flag
    acceptance_evidence:
      - docs/superpowers/reports/2026-08-08-account-monitor-probe-source-and-card-affordances-production-verification.md
      - docs/project/project-progress.md
    legacy_implementation: Provider-specific balance and multiplier probes were embedded in monitor and account services.
    target_implementation: Narrow adapters collect provider facts; control plane stores timestamped projections and uses official account APIs for writes.

