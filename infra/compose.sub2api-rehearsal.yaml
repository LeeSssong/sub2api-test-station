name: sub2api-official-rehearsal

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${REHEARSAL_POSTGRES_DATA_DIR:?REHEARSAL_POSTGRES_DATA_DIR must be absolute}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${REHEARSAL_REDIS_DATA_DIR:?REHEARSAL_REDIS_DATA_DIR must be absolute}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *logging

  sub2api:
    image: ${REHEARSAL_ROLLBACK_IMAGE:?REHEARSAL_ROLLBACK_IMAGE is required}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${REHEARSAL_SUB2API_DATA_DIR:?REHEARSAL_SUB2API_DATA_DIR must be absolute}
        target: /app/data
        bind:
          create_host_path: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.caddy
    image: xingqiao-caddy:sub2api-official-rehearsal
    restart: unless-stopped
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    command:
      - /bin/sh
      - -ec
      - |
        cat >/tmp/Caddyfile <<'EOF'
        :8080 {
          @guard {
            method POST
            path /api/v1/admin/system/update /api/v1/admin/system/rollback
          }
          respond @guard `{"code":"DOCKER_DEPLOYMENT_UPDATE_REQUIRED"}` 409

          @support_index path /support /support/
          handle @support_index {
            root * /srv/home
            rewrite * /index.html
            header Cache-Control "no-store, max-age=0"
            header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'"
            header X-Frame-Options SAMEORIGIN
            file_server
          }

          @support_assets path /support/*
          handle @support_assets {
            root * /srv/home
            file_server
          }

          @homepage_assets path /home-assets/*
          handle @homepage_assets {
            root * /srv/home
            file_server
          }

          reverse_proxy sub2api:8080
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      sub2api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    tmpfs: [/tmp]
    read_only: true
    logging: *logging
