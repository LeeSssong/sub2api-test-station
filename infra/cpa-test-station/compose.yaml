name: cpa-test-station

services:
  cpa-gateway:
    image: eceasy/cli-proxy-api@sha256:0c59d29e962089bec30e5cdf174ef29024693bb3af7fb2a7c111dfab664b84c5
    restart: unless-stopped
    ports:
      - "${CPA_BIND_ADDRESS:-0.0.0.0}:8317:8317"
    volumes:
      - ${CPA_TEST_ROOT:-/opt/cpa-test-station}/cliproxyapi/config.yaml:/CLIProxyAPI/config.yaml
      - ${CPA_TEST_ROOT:-/opt/cpa-test-station}/cliproxyapi/auths:/root/.cli-proxy-api
      - ${CPA_TEST_ROOT:-/opt/cpa-test-station}/cliproxyapi/logs:/CLIProxyAPI/logs
      - ${CPA_TEST_ROOT:-/opt/cpa-test-station}/cliproxyapi/plugins:/CLIProxyAPI/plugins:ro
      - ${CPA_TEST_ROOT:-/opt/cpa-test-station}/cliproxyapi/static:/CLIProxyAPI/static:ro
      - ${CPA_TEST_ROOT:-/opt/cpa-test-station}/cliproxyapi/ticket-gateway-data:/var/lib/cliproxy-ticket-gateway
    networks: [cpa-test]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/bin/timeout 5 /usr/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8317;
          printf "GET /management.html HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
    logging:
      options: {max-size: "10m", max-file: "3"}

  cpa-legacy-entry:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "${CPA_BIND_ADDRESS:-0.0.0.0}:18317:18317"
    volumes:
      - ${CPA_TEST_ROOT:-/opt/cpa-test-station}/edge/legacy-entry.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [cpa-test]
    logging:
      options: {max-size: "10m", max-file: "3"}

networks:
  cpa-test:
    name: cpa-test-station-network
