name: sub2api

services:
  caddy-bootstrap:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.bootstrap:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

volumes:
  caddy_data:
  caddy_config:
