name: sub2api-blue-green-rehearsal

x-sub2api-environment: &sub2api-environment
  AUTO_SETUP: "true"
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8080"
  SERVER_MODE: release
  RUN_MODE: standard
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DATABASE_DBNAME: ${POSTGRES_DB:?POSTGRES_DB is required}
  DATABASE_SSLMODE: disable
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
  TZ: ${TZ:-Asia/Shanghai}

x-sub2api-service: &sub2api-service
  restart: unless-stopped
  expose: ["8080"]
  volumes:
    - type: bind
      source: ${REHEARSAL_SUB2API_DATA_DIR:?REHEARSAL_SUB2API_DATA_DIR must be absolute}
      target: /app/data
      bind:
        create_host_path: false
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  healthcheck: &sub2api-healthcheck
    test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${REHEARSAL_POSTGRES_DATA_DIR:?REHEARSAL_POSTGRES_DATA_DIR must be absolute}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${REHEARSAL_REDIS_DATA_DIR:?REHEARSAL_REDIS_DATA_DIR must be absolute}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *logging

  sub2api-blue:
    <<: *sub2api-service
    image: ${SUB2API_BLUE_IMAGE:?SUB2API_BLUE_IMAGE is required}
    environment:
      <<: *sub2api-environment
      SERVER_PROCESS_ROLE: api
    healthcheck: *sub2api-healthcheck
    logging: *logging

  sub2api-green:
    <<: *sub2api-service
    image: ${SUB2API_GREEN_IMAGE:?SUB2API_GREEN_IMAGE is required}
    environment:
      <<: *sub2api-environment
      SERVER_PROCESS_ROLE: api
    healthcheck: *sub2api-healthcheck
    logging: *logging

  sub2api-worker:
    <<: *sub2api-service
    image: ${SUB2API_WORKER_IMAGE:?SUB2API_WORKER_IMAGE is required}
    environment:
      <<: *sub2api-environment
      SERVER_PROCESS_ROLE: worker
    healthcheck: *sub2api-healthcheck
    logging: *logging

  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.caddy
    image: xingqiao-caddy:sub2api-blue-green-rehearsal
    restart: unless-stopped
    environment:
      SUB2API_ACTIVE_UPSTREAM: ${SUB2API_ACTIVE_UPSTREAM:?SUB2API_ACTIVE_UPSTREAM is required}
      REHEARSAL_FAIL_PUBLIC_ACCEPTANCE: ${REHEARSAL_FAIL_PUBLIC_ACCEPTANCE:-false}
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    command:
      - /bin/sh
      - -ec
      - |
        SUB2API_ACTIVE_UPSTREAM=$$(awk -F= '$$1 == "SUB2API_ACTIVE_UPSTREAM" { value=$$2; count++ } END { if (count != 1) exit 1; print value }' /run/sub2api-release/release.env)
        export SUB2API_ACTIVE_UPSTREAM
        case "$$SUB2API_ACTIVE_UPSTREAM" in
          sub2api-blue:8080|sub2api-green:8080) ;;
          *) echo "invalid SUB2API_ACTIVE_UPSTREAM: $$SUB2API_ACTIVE_UPSTREAM" >&2; exit 64 ;;
        esac
        case "$$REHEARSAL_FAIL_PUBLIC_ACCEPTANCE" in
          true|false) ;;
          *) echo "invalid REHEARSAL_FAIL_PUBLIC_ACCEPTANCE" >&2; exit 64 ;;
        esac
        cat >/etc/caddy/Caddyfile <<'EOF'
        :8080 {
          @forced_public_failure {
            path /health
            expression {$$REHEARSAL_FAIL_PUBLIC_ACCEPTANCE} == true
          }
          respond @forced_public_failure `{"status":"forced_rehearsal_failure"}` 503
          reverse_proxy {$$SUB2API_ACTIVE_UPSTREAM}
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ${SUB2API_RELEASE_ENV_FILE:?SUB2API_RELEASE_ENV_FILE is required}:/run/sub2api-release/release.env:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    tmpfs: [/tmp, /etc/caddy, /data, /config]
    read_only: true
    logging: *logging
