name: sub2api

services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE is required}
    restart: unless-stopped
    expose: ["8080"]
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES:-172.16.0.0/12}
      SERVER_MAX_REQUEST_BODY_SIZE: ${SERVER_MAX_REQUEST_BODY_SIZE:-16777216}
      GATEWAY_MAX_BODY_SIZE: ${GATEWAY_MAX_BODY_SIZE:-16777216}
      GATEWAY_TEXT_MAX_BODY_SIZE: ${GATEWAY_TEXT_MAX_BODY_SIZE:-16777216}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_DBNAME: ${POSTGRES_DB}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDIS_DB: "0"
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-64}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-5}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
      TZ: ${TZ:-Asia/Shanghai}
      SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-true}
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-true}
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
    volumes:
      - type: bind
        source: ${SUB2API_DATA_DIR:?SUB2API_DATA_DIR is required}
        target: /app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging: &logging
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-60}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}", "-c", "effective_cache_size=512MB", "-c", "maintenance_work_mem=32MB"]
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR is required}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging

  relay-ops:
    build:
      context: ..
      dockerfile: infra/Dockerfile.relay-ops
    restart: unless-stopped
    expose: ["8100"]
    environment:
      RELAY_OPS_MODE: ${RELAY_OPS_MODE:-read_only}
      RELAY_OPS_CANDIDATE_SECRET_DIR: /var/lib/relay-ops/candidate-keys
      RELAY_OPS_LISTEN_ADDRESS: :8100
      RELAY_OPS_TIMEZONE: Asia/Shanghai
      RELAY_OPS_PUBLIC_BASE_URL: https://${SITE_ADDRESS}
      RELAY_OPS_DATABASE_URL_FILE: /run/secrets/relay-ops-database-url
      RELAY_OPS_SUB2API_URL: http://sub2api:8080
      RELAY_OPS_SUB2API_ADMIN_KEY_FILE: /run/secrets/sub2api-admin-api-key
      RELAY_OPS_ACCOUNT_QUALITY_RESULT_FILE: /run/relay-ops/account-quality/account-quality-result.json
      RELAY_OPS_UPSTREAM_GROUP_MAPPING_FILE: ${RELAY_OPS_UPSTREAM_GROUP_MAPPING_FILE:-}
      RELAY_OPS_FEISHU_WEBHOOK_FILE: ${RELAY_OPS_FEISHU_WEBHOOK_FILE:-}
      RELAY_OPS_FEISHU_COMMAND_MODE: ${RELAY_OPS_FEISHU_COMMAND_MODE:-disabled}
      RELAY_OPS_FEISHU_APP_ID_FILE: ${RELAY_OPS_FEISHU_APP_ID_FILE:-}
      RELAY_OPS_FEISHU_APP_SECRET_FILE: ${RELAY_OPS_FEISHU_APP_SECRET_FILE:-}
      RELAY_OPS_FEISHU_VERIFICATION_TOKEN_FILE: ${RELAY_OPS_FEISHU_VERIFICATION_TOKEN_FILE:-}
      RELAY_OPS_FEISHU_ENCRYPT_KEY_FILE: ${RELAY_OPS_FEISHU_ENCRYPT_KEY_FILE:-}
      RELAY_OPS_FEISHU_ROUTING_FILE: ${RELAY_OPS_FEISHU_ROUTING_FILE:-}
      RELAY_OPS_FEISHU_ALERT_CHAT_ID_FILE: ${RELAY_OPS_FEISHU_ALERT_CHAT_ID_FILE:-}
      RELAY_OPS_FEISHU_ALERT_RECIPIENTS_FILE: ${RELAY_OPS_FEISHU_ALERT_RECIPIENTS_FILE:-}
      RELAY_OPS_AGENT_BASE_URL: ${RELAY_OPS_AGENT_BASE_URL:-}
      RELAY_OPS_AGENT_API_KEY_FILE: /run/secrets/agent-api-key
      RELAY_OPS_AGENT_MODEL: ${RELAY_OPS_AGENT_MODEL:-}
    volumes:
      - ${RELAY_OPS_DATABASE_URL_HOST_FILE:-./secrets/relay-ops-database-url}:/run/secrets/relay-ops-database-url:ro
      - ${RELAY_OPS_SUB2API_ADMIN_KEY_HOST_FILE:-./secrets/sub2api-admin-api-key}:/run/secrets/sub2api-admin-api-key:ro
      - ${RELAY_OPS_ACCOUNT_QUALITY_RESULT_HOST_DIR:-/dev/null}:/run/relay-ops/account-quality:ro
      - ${RELAY_OPS_UPSTREAM_GROUP_MAPPING_HOST_FILE:-/dev/null}:/run/relay-ops/upstream-group-mapping.json:ro
      - ${RELAY_OPS_FEISHU_WEBHOOK_HOST_FILE:-/dev/null}:/run/secrets/feishu-webhook:ro
      - ${RELAY_OPS_FEISHU_APP_ID_HOST_FILE:-/dev/null}:/run/secrets/feishu-app-id:ro
      - ${RELAY_OPS_FEISHU_APP_SECRET_HOST_FILE:-/dev/null}:/run/secrets/feishu-app-secret:ro
      - ${RELAY_OPS_FEISHU_VERIFICATION_TOKEN_HOST_FILE:-/dev/null}:/run/secrets/feishu-verification-token:ro
      - ${RELAY_OPS_FEISHU_ENCRYPT_KEY_HOST_FILE:-/dev/null}:/run/secrets/feishu-encrypt-key:ro
      - ${RELAY_OPS_FEISHU_ROUTING_HOST_FILE:-/dev/null}:/run/secrets/feishu-routing.json:ro
      - ${RELAY_OPS_FEISHU_ALERT_CHAT_ID_HOST_FILE:-/dev/null}:/run/secrets/feishu-alert-chat-id:ro
      - ${RELAY_OPS_FEISHU_ALERT_RECIPIENTS_HOST_FILE:-/dev/null}:/run/secrets/feishu-alert-recipients.json:ro
      - ${RELAY_OPS_AGENT_API_KEY_HOST_FILE:-./secrets/agent-api-key}:/run/secrets/agent-api-key:ro
      - ${RELAY_OPS_CANDIDATE_KEYS_HOST_DIR:-./secrets/candidate-keys}:/run/secrets/candidates:ro
      - ${RELAY_OPS_CANDIDATE_MANAGED_KEYS_HOST_DIR:-./secrets/candidate-managed-keys}:/var/lib/relay-ops/candidate-keys:rw
      - ${RELAY_OPS_USAGE_SESSIONS_HOST_DIR:-./secrets/upstream-sessions}:/run/secrets/upstream-sessions:ro
    read_only: true
    tmpfs: [/tmp]
    user: "10002:10002"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 0.75
    depends_on:
      postgres: {condition: service_healthy}
      sub2api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --save 60 1 --appendonly yes --appendfsync everysec --maxclients ${REDIS_MAXCLIENTS:-1000} --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${REDIS_DATA_DIR:?REDIS_DATA_DIR is required}
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.caddy
    image: xingqiao-caddy:homepage-20260725-v8-detailed-guide
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?required}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-172.18.0.1/32}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sub2api-update-ui:/srv/sub2api-update-ui:ro
      - /run/sub2api-updater:/run/sub2api-updater:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sub2api: {condition: service_healthy}
      relay-ops: {condition: service_healthy}
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
