      - accounts
      - groups
    ui_routes:
      - /admin/operations/account-profitability
    source_of_truth:
      - usage_logs actual_cost and account cost metadata
      - versioned profitability projection
    acceptance_evidence:
      - docs/project/project-progress.md
      - docs/superpowers/reports/2026-08-08-monitor-probe-admin-cost-production-verification.md
    legacy_implementation: Profit formulas and CSV export were compiled into the Sub2API admin application.
    target_implementation: External read model computes versioned revenue, cost, profit and margin from immutable request events and exposes a compatible admin route.

  - capability: accounting-and-reconciliation
    owner: control_plane
    source_paths:
      - docs/superpowers/reports/2026-08-05-relay-ops-accounting-code-deployment.md
      - upstream/sub2api/backend/internal/handler/admin/usage.go
      - infra/compose.yaml
    api_paths:
