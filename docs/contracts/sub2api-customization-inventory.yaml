      - schema_migrations
    ui_routes:
      - /admin/settings
    source_of_truth:
      - qualified immutable image, migration hash and host release-state
      - administrator-visible update state machine
    acceptance_evidence:
      - docs/superpowers/reports/2026-08-01-main-blue-green-production-verification.md
      - docs/runbooks/sub2api-blue-green-production-deployment.md
    legacy_implementation: Official update was intercepted by a custom image merge/build path and required the bundled customization to be rebuilt.
    target_implementation: Host controller discovers and qualifies official releases, prepares a candidate, then promotes by blue-green cutover only after contract and readiness checks.

