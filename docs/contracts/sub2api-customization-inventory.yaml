      - docs/superpowers/reports/2026-07-30-native-ops-reminder-only-production-verification.md
    legacy_implementation: Authentication, admin navigation and update controls were shipped in the custom frontend bundle.
    target_implementation: Preserve the native same-domain session/2FA contract while allowing external control-plane pages to mount under compatible admin URLs.
