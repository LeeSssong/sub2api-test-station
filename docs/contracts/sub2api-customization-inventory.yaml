      - GET /api/v1/admin/usage/:id
      - GET /relay-ops/api/reconciliation/requests
      - GET /relay-ops/api/reconciliation/exceptions
    tables:
      - usage_logs
      - upstream_cost_attempts
      - upstream_reconciliation_exceptions
      - accounting_daily_snapshots
    ui_routes:
      - /admin/usage
      - /admin/reconciliation
    source_of_truth:
      - Sub2API usage logs for customer charge facts
      - relay-ops ledger and reconciliation records for upstream cost facts
    acceptance_evidence:
      - docs/superpowers/reports/2026-08-01-main-blue-green-production-verification.md
      - docs/superpowers/reports/2026-08-05-relay-ops-accounting-code-deployment.md
    legacy_implementation: Usage and billing history were native admin queries, with reconciliation data introduced in the custom relay-ops runtime.
    target_implementation: External ledger owns reconciliation and daily close; Sub2API remains the sole customer billing writer and both systems are joined by request IDs.

  - capability: balance-and-multiplier-collection
    owner: adapter
    source_paths:
      - upstream/sub2api/backend/internal/service/account_monitor.go
      - ops/collect-account-quality-pulse.rb
      - docs/project/account-monitor-cost-balance-context.md
    api_paths:
