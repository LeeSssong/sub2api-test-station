    profile_id: bounded-text-capacity-v3
    profile_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    measurement_location: production-edge
    required_request_kinds: [sync, sse]
  - group: group-b
    role: gateway_backup
    channel: backup-channel
    account_evidence_ref: sha256:shared-backup
