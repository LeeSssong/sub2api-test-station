    target_implementation: Thin event adapter emits an immutable completion envelope consumed by external monitor, profitability and ledger projections.

  - capability: official-upgrade-discovery-and-release
    owner: host
    source_paths:
      - ops/release-sub2api-blue-green.sh
      - ops/deploy-sub2api-blue-green-host.sh
